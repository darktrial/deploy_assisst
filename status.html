<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>GT 一鍵出征：執行紀錄</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;max-width:850px;margin:40px auto;padding:0 24px;background:#f7f8fa;color:#182538}
section{background:white;padding:24px;border-radius:14px}button{font:inherit;padding:8px 18px;cursor:pointer}li{margin:10px 0}time{color:#58677c;font-size:14px}
</style></head><body><h1>GT 一鍵出征</h1>
<p>選好可採集的資源點 → 按 F8 或點工具列圖示 → 第一組預設列隊 → 出征 → 逐次加速至剩餘 ≤ 1 秒（無固定個數上限）。</p>
<p>藍色 …：執行中／綠色 ✓：已抵達並開始採集／橘色 !：請查看紀錄。停止快捷鍵：Alt+Shift+X。</p>
<section><h2 id="status">讀取中…</h2><button id="stop" disabled>停止後續操作</button><ol id="log"></ol></section>
<p><button id="repair">修復 F8（不出征）</button> <span id="repairStatus"></span></p>
<p>F8 沒有反應時，可先按修復；若仍無提示，重新整理遊戲並確認鍵盤是否需按 Fn+F8。此版本使用一般腳本注入，不會附加 debugger。</p>
<p>停止不會撤回已出征的軍隊或已使用的道具。若道具用完仍未抵達，會等待行軍自然抵達，最多觀察兩分鐘。</p>
<script type="module" src="status.js"></script></body></html>
